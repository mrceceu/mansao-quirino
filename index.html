:root{
  --font:"Allo",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --bg:#fff;--card:#f4f4f2;--ink:#141414;--ink2:#3a3a38;--muted:#8b8b86;--line:#e7e7e3;
  --accent:#d9467a;--bow:#e0457b;--tongue:#e89aa1;--warn:#c2412d;--ok:#3f7d5a;
  --r:22px;--safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--font);font-size:15px;line-height:1.35;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
.muted{color:var(--muted)}
.app{max-width:460px;margin:0 auto;padding:10px 16px calc(120px + var(--safe-b))}
.icon{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* topo */
.top{display:flex;align-items:center;justify-content:space-between;height:46px}
.brand{font-weight:800;letter-spacing:-.03em;font-size:19px;display:flex;align-items:center;gap:8px}
.brand small{font-weight:500;color:var(--muted);font-size:12px;letter-spacing:0}
.who{display:flex;align-items:center;gap:6px;height:36px;padding:0 12px 0 3px;border-radius:99px;background:var(--card);font-weight:600;font-size:13.5px}
.who .av{width:30px;height:30px;border-radius:50%;background:#fff;overflow:hidden;display:grid;place-items:center}
.who .av svg{width:26px;height:26px}

/* herói */
.hero{display:flex;flex-direction:column;align-items:center;padding:4px 0 2px}
.bubble{position:relative;background:var(--ink);color:#fff;padding:9px 14px;border-radius:14px;font-size:14px;max-width:300px;text-align:center;transition:opacity .25s,transform .25s}
.bubble::after{content:"";position:absolute;left:50%;bottom:-6px;width:12px;height:12px;background:var(--ink);transform:translateX(-50%) rotate(45deg);border-radius:2px}
.bubble.swap{opacity:0;transform:translateY(4px)}
.hero-flor{width:200px;margin-top:6px;cursor:pointer}
.pose-name{font-size:11.5px;color:var(--muted);margin-top:-4px}
.saldo-lbl{font-size:13px;color:var(--ink2);margin-top:12px;text-align:center}
.big{font-size:44px;font-weight:800;letter-spacing:-.035em;line-height:1.05;margin-top:2px}
.big small{font-size:22px}
.sub{font-size:12.5px;color:var(--muted);margin-top:4px;text-align:center}

.cta{display:grid;grid-template-columns:1.4fr 1fr;gap:8px;margin:18px 0 14px}
.btn{height:50px;border-radius:16px;background:var(--card);font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.dark{background:var(--ink);color:#fff}
.btn:active{transform:scale(.98)}

/* cards e listas */
.card{background:var(--card);border-radius:var(--r);padding:14px 16px;margin-bottom:12px}
.card-h{display:flex;align-items:center;justify-content:space-between;font-size:13.5px;font-weight:600;margin-bottom:4px}
.card-h .lnk{font-weight:500;color:var(--ink2);font-size:13px}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;width:100%;text-align:left}
.row+.row{border-top:1px solid var(--line)}
.row .t{flex:1;min-width:0}
.row .t>div:first-child{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t>div+div{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .v{text-align:right;white-space:nowrap}
.row .v b{display:block;font-weight:600}
.row .v span{font-size:12px;color:var(--muted)}
.thumb{width:42px;height:42px;border-radius:12px;background:#fff center/cover no-repeat;flex:none;border:1px solid var(--line)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;background:#fff;color:var(--ink2)}
.tag.warn{background:#fbe4dd;color:var(--warn)}
.tag.ok{background:#e1efe6;color:var(--ok)}
.empty{text-align:center;padding:18px 6px;color:var(--muted);font-size:13.5px}
.empty b{display:block;color:var(--ink);margin-bottom:3px}
.page-title{font-size:26px;font-weight:800;letter-spacing:-.03em;margin:8px 0 12px}
.month-h{font-size:12px;color:var(--muted);margin:16px 4px 4px}
.month-h::first-letter{text-transform:uppercase}
.filters{display:flex;gap:6px;overflow-x:auto;margin-bottom:6px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.bar{height:5px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:9px}

/* tab bar */
.tabs{position:fixed;left:50%;bottom:calc(14px + var(--safe-b));transform:translateX(-50%);display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.88);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);padding:6px;border-radius:99px;box-shadow:0 6px 30px rgba(0,0,0,.08),0 0 0 1px rgba(0,0,0,.04);z-index:20}
.tab{width:52px;height:42px;border-radius:99px;display:grid;place-items:center;color:var(--muted)}
.tab.on{background:var(--card);color:var(--ink)}
.tab.plus{background:var(--ink);color:#fff;width:46px;height:46px;margin:0 4px}
body::after{content:"";position:fixed;left:0;right:0;bottom:0;height:calc(96px + var(--safe-b));pointer-events:none;z-index:19;background:linear-gradient(to bottom,rgba(255,255,255,0),rgba(255,255,255,.92) 55%,#fff)}

/* sheet */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}
.backdrop.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;width:100%;max-width:460px;transform:translate(-50%,105%);background:#fff;border-radius:26px 26px 0 0;padding:10px 18px calc(18px + var(--safe-b));z-index:41;transition:transform .32s cubic-bezier(.2,.8,.2,1);max-height:94vh;overflow:auto}
.sheet.on{transform:translate(-50%,0)}
.grab{width:38px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 10px}
.sheet-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.sheet-h h3{margin:0;font-size:18px;font-weight:700}
.x{width:32px;height:32px;border-radius:50%;background:var(--card);display:grid;place-items:center}
.flabel{font-size:12.5px;color:var(--muted);margin:14px 2px 7px}
.field{width:100%;height:46px;border:1px solid var(--line);border-radius:12px;padding:0 14px;background:#fff;outline:none}
textarea.field{height:84px;padding:12px 14px;resize:none}
.field:focus{border-color:var(--ink)}
.money{font-size:26px;font-weight:800;height:56px;letter-spacing:-.02em}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{height:36px;padding:0 14px;border-radius:99px;background:var(--card);font-weight:500;font-size:13.5px}
.pill.on{background:var(--ink);color:#fff}
.seg{display:grid;background:var(--card);border-radius:12px;padding:3px}
.seg button{height:34px;border-radius:9px;font-weight:500;color:var(--muted);font-size:13.5px}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.primary{width:100%;height:52px;border-radius:99px;background:var(--ink);color:#fff;font-weight:600;margin-top:16px}
.primary:disabled{opacity:.3}
.ghost{width:100%;height:46px;border-radius:99px;background:var(--card);font-weight:500;margin-top:8px}
.danger{color:var(--warn)}
.hint{font-size:12.5px;color:var(--muted);margin-top:6px}
.hint.err{color:var(--warn)}
.photo-pick{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;height:130px;border:2px dashed var(--line);border-radius:18px;color:var(--muted);font-size:13.5px;background:#fafaf8;position:relative;overflow:hidden}
.photo-pick.has{border-style:solid;border-color:var(--ink)}
.photo-pick img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photo-pick input{position:absolute;inset:0;opacity:0;cursor:pointer}
.photo-pick .chg{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.65);color:#fff;font-size:12px;padding:4px 10px;border-radius:99px}
.cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;width:70px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;color:var(--muted)}
.cat span{width:44px;height:44px;border-radius:50%;background:var(--card);display:grid;place-items:center;color:var(--ink)}
.cat.on span{background:var(--ink);color:#fff}
.cat.on{color:var(--ink)}
.summary{background:var(--card);border-radius:16px;padding:12px 14px;margin-top:14px;font-size:13.5px}
.summary b{font-weight:700}
.toggle{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
.sw{width:46px;height:28px;border-radius:99px;background:var(--line);position:relative;transition:background .2s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.sw.on{background:var(--ink)}
.sw.on::after{transform:translateX(18px)}
.split{display:grid;grid-template-columns:1fr auto auto;gap:4px 14px;font-size:13.5px;margin-top:8px}
.split .h{font-size:11.5px;color:var(--muted)}
.split .n{text-align:right}
.comment{background:var(--card);border-radius:14px;padding:9px 12px;margin-top:6px;font-size:13.5px}
.comment small{display:block;color:var(--muted);font-size:11.5px;margin-bottom:2px}
.det-photo{width:100%;max-height:260px;object-fit:cover;border-radius:16px;background:var(--card);display:block;cursor:zoom-in}
.viewer{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:80;display:flex;align-items:center;justify-content:center;padding:16px}
.viewer img{max-width:100%;max-height:100%;border-radius:8px}

/* telas cheias */
.full{position:fixed;inset:0;background:#fff;z-index:60;display:flex;flex-direction:column;align-items:center;padding:44px 22px calc(24px + var(--safe-b));overflow:auto}
.duo{display:flex;justify-content:center;align-items:flex-end;gap:10px;width:100%}
.duo .flor{width:min(170px,42vw);flex:none}
.word{font-size:40px;font-weight:800;letter-spacing:-.045em;line-height:1;margin-top:6px;text-align:center}
.word small{display:block;font-size:14px;font-weight:500;letter-spacing:0;color:var(--muted);margin-top:6px}
.full form,.full .pickp{width:100%;max-width:380px;margin-top:22px}
.err{color:var(--warn);font-size:13px;min-height:18px;margin-top:8px;text-align:center}
.pickp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pickp button{border-radius:20px;background:var(--card);padding:10px 8px 14px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:700;font-size:16px;border:2px solid transparent}
.pickp button:active{border-color:var(--ink)}
.pickp svg{width:100%}

/* animações da Flor */
.flor{overflow:visible;display:block}
.flor .fl-body{transform-origin:50% 80%;animation:fl-breathe 4s ease-in-out infinite}
.flor .fl-tongue{transform-origin:100px 128px;animation:fl-tongue 2.6s ease-in-out infinite}
.flor .fl-note{animation:fl-note 3s ease-in-out infinite}
.flor .fl-drop{animation:fl-drop 1.8s ease-in infinite}
.flor .fl-lift{animation:fl-lift 1.6s ease-in-out infinite}
.flor .fl-sun{animation:fl-spin 24s linear infinite}
.flor .fl-steam{animation:fl-steam 2.4s ease-in-out infinite}
.flor .fl-rays{animation:fl-rays 3s ease-in-out infinite;transform-origin:100px 200px}
.flor .fl-speed{animation:fl-speed .9s linear infinite}
@keyframes fl-breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.02,1.012)}}
@keyframes fl-tongue{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.18)}}
@keyframes fl-note{0%,100%{transform:translateY(0);opacity:1}50%{transform:translateY(-8px);opacity:.6}}
@keyframes fl-drop{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(18px);opacity:0}}
@keyframes fl-lift{0%,100%{transform:translateY(8px)}50%{transform:translateY(-6px)}}
@keyframes fl-spin{to{transform:rotate(360deg)}}
@keyframes fl-steam{0%,100%{opacity:.2;transform:translateY(2px)}50%{opacity:1;transform:translateY(-3px)}}
@keyframes fl-rays{0%,100%{opacity:.25}50%{opacity:.45}}
@keyframes fl-speed{0%{transform:translateX(0);opacity:1}100%{transform:translateX(-14px);opacity:0}}
.boop .fl-body{animation:fl-boop .4s ease-out}
@keyframes fl-boop{40%{transform:scale(.94,1.05)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
/* =================================================================
   A Flor da Mansão Quirino
   Sempre feliz. Base única (cabeça, laço, olhinhos ^^, língua)
   e acessórios por pose. Cada pessoa tem o seu conjunto de poses.
================================================================= */
const POSES_BASE = {
  rafael: ["musica", "pc", "lendo", "viagem", "show", "paodequeijo", "rede", "cansada", "frio"],
  lucas:  ["halter", "bone", "comex", "shake", "corrida", "sol", "lendo", "musica", "cansada", "frio"],
};
const POSE_NOME = {
  musica:"ouvindo música", pc:"no notebook", lendo:"lendo", viagem:"viajando", show:"no show",
  halter:"malhando", bone:"de boné", shake:"pós-treino", corrida:"correndo", sol:"na praia",
  natal:"natalina", cansada:"cansada", frio:"com frio", carnaval:"carnavalesca",
  paodequeijo:"comendo pão de queijo", rede:"na rede", comex:"no comércio exterior", feliz:"",
};
/* Datas especiais: Natal em dezembro; Carnaval de 10 dias antes a 3 dias depois da terça de Carnaval */
function terçaCarnaval(y){
  const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),
        h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),
        mes=Math.floor((h+l-7*m+114)/31), dia=((h+l-7*m+114)%31)+1;
  const t = new Date(y, mes-1, dia, 12); t.setDate(t.getDate()-47); return t;
}
function posesDe(p, agora = new Date()){
  const L = [...POSES_BASE[p]];
  if(agora.getMonth() === 11) L.unshift("natal");
  const t = terçaCarnaval(agora.getFullYear()), diff = (agora - t) / 864e5;
  if(diff >= -10 && diff <= 3) L.unshift("carnaval");
  return L;
}
const POSES = { get rafael(){ return posesDe("rafael"); }, get lucas(){ return posesDe("lucas"); } };

function florPose(pose = "feliz", C) {
  C = C || {};
  const INK = C.ink || "var(--ink)", BOW = C.bow || "var(--bow)", TONGUE = C.tongue || "var(--tongue)";
  const ACC = C.accent || "var(--accent)";
  const W = "#fff";
  const behind = [], front = [];
  let hideBow = false, glasses = "", eyes = "happy";

  const note = (x, y, d) => `<g class="fl-note" style="animation-delay:${d}s" transform="translate(${x} ${y})" fill="${INK}">
      <ellipse cx="0" cy="0" rx="6" ry="4.6" transform="rotate(-20)"/><rect x="4.2" y="-20" width="2.6" height="20" rx="1.2"/>
      <path d="M6.8 -20 Q16 -16 14 -6 Q12 -13 6.8 -13Z"/></g>`;
  const sunglasses = `<g><path d="M60 94 h31 v8 q0 12 -15 12 q-16 0 -16 -12z" fill="#1d1d1d" stroke="${W}" stroke-width="3"/>
      <path d="M109 94 h31 v8 q0 12 -16 12 q-15 0 -15 -12z" fill="#1d1d1d" stroke="${W}" stroke-width="3"/>
      <path d="M91 98 h18" stroke="${W}" stroke-width="3"/><path d="M66 99 l8 -3" stroke="#fff" stroke-width="2.4" stroke-linecap="round" opacity=".7"/>
      <path d="M115 99 l8 -3" stroke="#fff" stroke-width="2.4" stroke-linecap="round" opacity=".7"/></g>`;
  const drop = (x, y, d) => `<path class="fl-drop" style="animation-delay:${d}s" d="M${x} ${y} q5 8 0 11 q-5 -3 0 -11z" fill="#7fb6e8"/>`;

  switch (pose) {
    case "musica":
      front.push(`<path d="M34 96 Q36 18 100 16 Q164 18 166 96" fill="none" stroke="${INK}" stroke-width="9" stroke-linecap="round"/>
        <path d="M34 96 Q36 18 100 16 Q164 18 166 96" fill="none" stroke="${ACC}" stroke-width="4" stroke-linecap="round"/>
        <rect x="18" y="84" width="28" height="42" rx="12" fill="${ACC}" stroke="${INK}" stroke-width="3"/>
        <rect x="154" y="84" width="28" height="42" rx="12" fill="${ACC}" stroke="${INK}" stroke-width="3"/>
        ${note(196, 50, 0)}${note(212, 92, 1.1)}${note(-6, 44, .6)}`);
      hideBow = true;
      break;
    case "pc":
      front.push(`<path d="M44 128 h112 l-6 42 h-100z" fill="#cfccc6" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/>
        <rect x="28" y="168" width="144" height="10" rx="5" fill="#a9a59e" stroke="${INK}" stroke-width="3"/>
        <g transform="translate(100 150)" fill="${ACC}"><circle r="5"/><circle cx="-7" cy="-7" r="2.6"/><circle cx="-2.5" cy="-10" r="2.6"/><circle cx="2.5" cy="-10" r="2.6"/><circle cx="7" cy="-7" r="2.6"/></g>
        <g><rect x="170" y="140" width="26" height="30" rx="5" fill="#fff" stroke="${INK}" stroke-width="3"/>
        <path d="M196 148 q10 0 10 8 q0 8 -10 8" fill="none" stroke="${INK}" stroke-width="3"/>
        <rect x="170" y="150" width="26" height="6" fill="${ACC}"/>
        <path class="fl-steam" d="M178 132 q-4 -6 0 -12 M188 132 q-4 -6 0 -12" stroke="#bdb8b0" stroke-width="2.5" fill="none" stroke-linecap="round"/></g>`);
      break;
    case "lendo":
      glasses = `<g fill="none" stroke="${W}" stroke-width="3"><circle cx="75.5" cy="102" r="14"/><circle cx="124.5" cy="102" r="14"/><path d="M89.5 101 q10.5 -6 21 0"/></g>`;
      front.push(`<g transform="translate(0 4)">
        <path d="M100 136 Q76 124 46 130 L46 174 Q76 168 100 180Z" fill="#fff" stroke="${INK}" stroke-width="3.2" stroke-linejoin="round"/>
        <path d="M100 136 Q124 124 154 130 L154 174 Q124 168 100 180Z" fill="#fff" stroke="${INK}" stroke-width="3.2" stroke-linejoin="round"/>
        <path d="M56 142 q18 -4 34 2 M56 152 q18 -4 34 2 M56 162 q18 -4 34 2 M110 144 q16 -6 34 -2 M110 154 q16 -6 34 -2 M110 164 q16 -6 34 -2" stroke="#c9c5be" stroke-width="2.2" fill="none" stroke-linecap="round"/>
        <path d="M128 128 v22 l5 -5 l5 5 v-23" fill="${ACC}"/></g>`);
      break;
    case "viagem":
      hideBow = true;
      front.push(`<path d="M56 66 Q60 14 100 12 Q140 14 144 66Z" fill="#3a63c9" stroke="${INK}" stroke-width="3"/>
        <path d="M70 30 Q100 22 130 30 M62 48 Q100 38 138 48" stroke="#fff" stroke-width="3" fill="none" opacity=".55"/>
        <rect x="50" y="58" width="100" height="16" rx="8" fill="#2c4fa8" stroke="${INK}" stroke-width="3"/>
        <circle cx="100" cy="10" r="11" fill="#fff" stroke="${INK}" stroke-width="3"/>
        <path d="M40 150 Q100 176 160 150 L160 166 Q100 190 40 166Z" fill="${ACC}" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/>
        <path d="M128 166 L136 210 L150 206 L144 164Z" fill="${ACC}" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/>
        <path d="M136 210 l-2 7 M142 208 l0 7 M148 206 l2 7" stroke="${INK}" stroke-width="2.5" stroke-linecap="round"/>`);
      behind.push(`<g fill="none" stroke="#b9c6e3" stroke-width="2.5" stroke-linecap="round" class="fl-snow">
        <path d="M-6 30 l10 0 M-1 25 l0 10 M-4.5 26.5 l7 7 M-4.5 33.5 l7 -7"/>
        <path d="M200 20 l12 0 M206 14 l0 12 M202 16 l8 8 M202 24 l8 -8"/>
        <path d="M208 140 l10 0 M213 135 l0 10"/></g>`);
      break;
    case "show":
      glasses = sunglasses;
      behind.push(`<g opacity=".28" class="fl-rays"><path d="M-10 -20 L60 200 L100 200Z" fill="${ACC}"/>
        <path d="M210 -20 L100 200 L150 200Z" fill="#3a63c9"/><path d="M100 -30 L80 200 L120 200Z" fill="#efc93a"/></g>`);
      front.push(`<g class="fl-confetti"><rect x="-4" y="40" width="7" height="7" fill="#efc93a" transform="rotate(20 0 44)"/>
        <rect x="202" y="70" width="7" height="7" fill="${ACC}" transform="rotate(-15 205 74)"/>
        <circle cx="190" cy="20" r="4" fill="#3a63c9"/><circle cx="10" cy="120" r="4" fill="${ACC}"/></g>
        <g transform="rotate(-25 178 150)"><rect x="172" y="118" width="12" height="54" rx="6" fill="#9be15d" stroke="${INK}" stroke-width="3"/></g>`);
      break;
    case "halter":
      front.push(`<g class="fl-lift"><rect x="20" y="-6" width="160" height="7" rx="3.5" fill="#6d6a65" stroke="${INK}" stroke-width="2"/>
        <rect x="10" y="-22" width="18" height="40" rx="5" fill="${INK}"/><rect x="-2" y="-14" width="12" height="24" rx="4" fill="${INK}"/>
        <rect x="172" y="-22" width="18" height="40" rx="5" fill="${INK}"/><rect x="190" y="-14" width="12" height="24" rx="4" fill="${INK}"/>
        <circle cx="60" cy="2" r="9" fill="${INK}"/><circle cx="140" cy="2" r="9" fill="${INK}"/>
        <path d="M60 8 L58 52 M140 8 L142 52" stroke="${INK}" stroke-width="12" stroke-linecap="round"/></g>
        ${drop(176, 72, 0)}${drop(22, 82, .9)}`);
      hideBow = true;
      break;
    case "bone":
      hideBow = true;
      glasses = sunglasses;
      front.push(`<path d="M54 70 Q56 18 100 16 Q146 18 148 70Z" fill="#c98a3a" stroke="${INK}" stroke-width="3"/>
        <path d="M100 16 L100 68" stroke="${INK}" stroke-width="2" opacity=".35"/>
        <circle cx="100" cy="17" r="4" fill="${INK}"/>
        <path d="M46 70 Q100 58 182 74 Q186 84 170 84 Q110 78 46 78Z" fill="#b2772c" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/>
        <rect x="88" y="36" width="24" height="12" rx="3" fill="#fff" opacity=".9"/>`);
      break;
    case "shake":
      front.push(`<g transform="rotate(10 186 130)"><rect x="166" y="96" width="38" height="78" rx="10" fill="#fff" stroke="${INK}" stroke-width="3"/>
        <rect x="170" y="80" width="30" height="20" rx="5" fill="${INK}"/><rect x="180" y="70" width="10" height="12" rx="3" fill="${INK}"/>
        <rect x="166" y="120" width="38" height="16" fill="${ACC}"/>
        <path d="M172 150 q14 6 28 0" stroke="#d9d4cc" stroke-width="3" fill="none"/></g>
        <circle cx="162" cy="134" r="11" fill="${INK}"/>`);
      eyes = "wink";
      break;
    case "corrida":
      hideBow = true;
      front.push(`<path d="M40 72 Q100 52 160 72 L158 88 Q100 68 42 88Z" fill="${ACC}" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/>
        <path d="M46 80 Q100 62 156 80" stroke="#fff" stroke-width="2.5" fill="none" opacity=".8"/>
        <path d="M40 78 L20 66 L24 84Z" fill="${ACC}" stroke="${INK}" stroke-width="2.5" stroke-linejoin="round"/>
        ${drop(170, 60, 0)}${drop(186, 90, .7)}`);
      behind.push(`<g stroke="${INK}" stroke-width="4" stroke-linecap="round" class="fl-speed"><path d="M-20 100 h28"/><path d="M-30 124 h36"/><path d="M-14 148 h24"/></g>`);
      break;
    case "sol":
      glasses = sunglasses;
      behind.push(`<g transform="translate(176 24)"><g class="fl-sun"><circle r="22" fill="#efc93a"/>
        ${Array.from({length:10},(_,i)=>`<rect x="-3" y="-40" width="6" height="12" rx="3" fill="#efc93a" transform="rotate(${i*36})"/>`).join("")}</g></g>`);
      front.push(`<path d="M-10 196 Q40 184 100 192 Q160 200 210 188 L210 214 L-10 214Z" fill="#7fb6e8" opacity=".8"/>`);
      break;
    case "natal":
      hideBow = true;
      front.push(`<path d="M52 64 Q70 6 136 20 Q170 30 178 70 L162 76 Q154 44 132 40 Q140 56 148 66Z" fill="#d23b3b" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/>
        <rect x="46" y="58" width="108" height="18" rx="9" fill="#fff" stroke="${INK}" stroke-width="3"/>
        <circle cx="172" cy="76" r="11" fill="#fff" stroke="${INK}" stroke-width="3"/>
        <g transform="translate(36 150)"><path d="M0 0 q-12 -6 -18 4 q10 2 18 -4z M0 0 q12 -6 18 4 q-10 2 -18 -4z" fill="#3f7d5a" stroke="${INK}" stroke-width="2"/><circle cx="-3" cy="2" r="4" fill="#d23b3b"/><circle cx="4" cy="3" r="4" fill="#d23b3b"/></g>`);
      behind.push(`<g fill="#d9d6d0"><circle cx="-10" cy="20" r="3"/><circle cx="214" cy="40" r="3.5"/><circle cx="200" cy="140" r="2.5"/><circle cx="0" cy="110" r="2.5"/></g>`);
      break;
    case "cansada":
      eyes = "tired";
      front.push(`<text class="fl-z" x="168" y="40" font-family="system-ui,sans-serif" font-weight="800" font-size="22" fill="${INK}">z</text>
        <text class="fl-z" style="animation-delay:.8s" x="186" y="18" font-family="system-ui,sans-serif" font-weight="800" font-size="15" fill="${INK}">z</text>
        <g><rect x="164" y="140" width="28" height="32" rx="6" fill="#fff" stroke="${INK}" stroke-width="3"/>
        <path d="M192 148 q10 0 10 8 q0 8 -10 8" fill="none" stroke="${INK}" stroke-width="3"/>
        <path class="fl-steam" d="M172 132 q-4 -6 0 -12 M182 132 q-4 -6 0 -12" stroke="#bdb8b0" stroke-width="2.5" fill="none" stroke-linecap="round"/></g>`);
      break;
    case "frio":
      front.push(`<path fill-rule="evenodd" d="M14 118 Q16 58 100 40 Q184 58 186 118 L192 198 Q100 222 8 198Z M100 64 Q48 66 46 108 Q48 150 100 156 Q152 150 154 108 Q152 66 100 64Z" fill="#c98a3a" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/>
        <path d="M14 176 Q100 200 186 176 M12 188 Q100 212 190 188" stroke="#8a5a1f" stroke-width="4" fill="none" opacity=".55"/>

const ic = (n, s=18) => `<svg class="icon" style="width:${s}px;height:${s}px" viewBox="0 0 24 24">${ICONS[n]}</svg>`;

/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const pad = n => String(n).padStart(2,"0");
const today = () => { const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const ymOf = d => d.slice(0,7);
const MESES = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const mesNome = k => { const [y,m]=k.split("-").map(Number); return MESES[m-1] + (y!==new Date().getFullYear()?` de ${y}`:""); };
const shiftYm = (k,n) => { let [y,m]=k.split("-").map(Number); m+=n; while(m>12){m-=12;y++} while(m<1){m+=12;y--} return `${y}-${pad(m)}`; };
const daysIn = k => { const [y,m]=k.split("-").map(Number); return new Date(y,m,0).getDate(); };
const brl = c => ((c||0)/100).toLocaleString("pt-BR",{style:"currency",currency:"BRL"}).replace(/ /g," ");
const brl0 = c => "R$ " + Math.round((c||0)/100).toLocaleString("pt-BR");
const parseCents = s => { const t=String(s||"").replace(/[^\d,.-]/g,""); if(!t) return 0; const n=parseFloat(t.replace(/\./g,"").replace(",",".")); return isNaN(n)?0:Math.round(n*100); };
const fmtIn = c => c ? (c/100).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2}) : "";
const esc = s => String(s||"").replace(/[&<>"]/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));
const dataBR = d => new Date(d+"T12:00").toLocaleDateString("pt-BR",{day:"numeric",month:"short"});
const catOf = id => CATS.find(c=>c.id===id) || CATS[CATS.length-1];
const H24 = 24*3600*1000;
const pick = a => a[Math.floor(Math.random()*a.length)];

/* ---------- estado ---------- */
let EU = null;               // "rafael" | "lucas"
let DESP = [];               // despesas
let ACERTOS = [];
let tab = "home", filtro = "todas";

/* ---------- regras de negócio ---------- */
/* Uma despesa conta no saldo se não foi recusada, se quem recusou aprovou,
   ou se já passaram 24h desde a recusa. */
const recusaAtiva = d => d.recusa && !d.recusa.ok && (Date.now() - d.recusa.em) < H24;
const conta = d => !recusaAtiva(d);

/* Divide um valor em n parcelas (a última leva os centavos que sobram) */
function divide(v, n){ const b = Math.trunc(v/n); return Array.from({length:n},(_,i)=> i<n-1 ? b : v - b*(n-1)); }

/* Lançamentos efetivos de uma despesa: um por parcela, com a data em que entra no saldo.
   net = quanto o Rafael fica a receber por causa dessa parcela (negativo = ele deve). */
function parcelasDe(d){
  const n = Math.max(1, d.parcelas||1);
  const netTot = (d.pagou.rafael||0) - (d.deve.rafael||0);
  const nets = divide(netTot, n), tots = divide(d.total, n);
  const dia = Number(d.data.slice(8));
  const ini = n>1 ? (d.inicio || ymOf(d.data)) : ymOf(d.data);
  return nets.map((net,i)=>{
    const k = shiftYm(ini, i);
    const data = n>1 ? `${k}-${pad(Math.min(dia, daysIn(k)))}` : d.data;
    return {d, i:i+1, n, net, valor:tots[i], data};
  });
}
const hoje = () => today();
const ultimoAcerto = () => [...ACERTOS].sort((a,b)=>a.criadoEm-b.criadoEm).pop() || null;

function saldoAtual(){
  const h = hoje();
  let s = 0;
  DESP.filter(conta).forEach(d => parcelasDe(d).forEach(p => { if(p.data <= h) s += p.net; }));
  ACERTOS.forEach(a => s -= (a.compensado||0));
  return s;
}
/* Parcelas que entraram depois de um acerto (até outro acerto, se houver) */
function noPeriodo(p, ini, fim){
  const depoisIni = !ini || p.data > ini.data || (p.data === ini.data && (p.d.criadoEm||0) > ini.criadoEm);
  const antesFim = !fim ? p.data <= hoje() : (p.data < fim.data || (p.data === fim.data && (p.i>1 || (p.d.criadoEm||0) <= fim.criadoEm)));
  return depoisIni && antesFim;
}
function periodo(ini, fim){
  const out = [];
  DESP.filter(conta).forEach(d => parcelasDe(d).forEach(p => { if(noPeriodo(p, ini, fim)) out.push(p); }));
  return out.sort((a,b)=> b.data.localeCompare(a.data));
}
/* Fechamento: contas divididas ao meio, compensando o saldo */
function calcFechamento(contas, saldo){
  const total = contas.reduce((a,c)=>a+c.valor,0);
  const r = Math.floor(total/2), l = total - r;
  let usado = saldo > 0 ? Math.min(saldo, r) : Math.max(saldo, -l);
  return {total, baseR:r, baseL:l, compensado:usado, rafael:r - usado, lucas:l + usado, sobra:saldo - usado};
}

/* --- nuvem --- */
const cloud = {auth:null, fs:null, user:null, unsubs:[]};
const col = n => cloud.fs.collection("casas").doc(CASA).collection(n);

};

/* =================================================================
   Fotos: comprime no aparelho antes de salvar
================================================================= */
function lerImagem(file){
  return new Promise((ok, err) => {
    const r = new FileReader();
    r.onload = () => { const img = new Image(); img.onload = () => ok(img); img.onerror = err; img.src = r.result; };
    r.onerror = err; r.readAsDataURL(file);
  });
}
function paraJpeg(img, lado, q){
  const s = Math.min(1, lado / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement("canvas");
  c.width = Math.round(img.naturalWidth*s); c.height = Math.round(img.naturalHeight*s);
  const g = c.getContext("2d"); g.fillStyle="#fff"; g.fillRect(0,0,c.width,c.height); g.drawImage(img,0,0,c.width,c.height);
  return c.toDataURL("image/jpeg", q);
}
async function comprimir(file){
  const img = await lerImagem(file);
  let lado = 1600, q = .72, foto = paraJpeg(img, lado, q);
  while(foto.length > 650000 && lado > 700){ lado -= 200; q = Math.max(.5, q-.05); foto = paraJpeg(img, lado, q); }
  const thumb = paraJpeg(img, 140, .6);
  return {foto, thumb};
}

function frase(s){
  const devedor = s > 0 ? "lucas" : "rafael", credor = OUTRO(devedor);
  const v = brl0(Math.abs(s));
  if(Math.abs(s) < 100) return pick(["Tudo zerado. Paz na Mansão.", "Ninguém deve nada. Pode me dar um petisco.", "Contas em dia. Abanando o rabo."]);

  return pick([`O ${PESSOAS[devedor]} te deve ${v}. Eu tô de olho.`, `${v} a seu favor. Cobra nas contas.`]);
}

  $("#poseName").textContent = `Flor ${POSE_NOME[poseAtual]}`;

  const s = saldoAtual(), ult = ultimoAcerto();
  const devedor = s > 0 ? "lucas" : "rafael", credor = OUTRO(devedor);
  if(Math.abs(s) < 100){ $("#saldoLbl").textContent = "Saldo da casa"; }
  else $("#saldoLbl").textContent = `${PESSOAS[devedor]} deve ao ${PESSOAS[credor]}`;
  const [i, c] = brl(Math.abs(s)).split(",");
  $("#big").innerHTML = `${i}<small>,${c}</small>`;
  $("#saldoSub").textContent = ult ? `desde o acerto de ${dataBR(ult.data)}` : "desde o começo";
  setBubble(frase(s));

  /* em discussão */
  const disc = DESP.filter(recusaAtiva);
  $("#homeDisc").innerHTML = disc.length ? `<div class="card"><div class="card-h">Em discussão <span class="tag warn">${disc.length}</span></div>${disc.map(rowDesp).join("")}</div>` : "";

  /* parcelas do mês */
  const k = ymOf(hoje());
  const doMes = [];
  DESP.filter(d=>(d.parcelas||1)>1 && conta(d)).forEach(d => parcelasDe(d).forEach(p => { if(ymOf(p.data)===k) doMes.push(p); }));
  $("#homeParc").innerHTML = doMes.length ? `<div class="card"><div class="card-h">Parcelas de ${mesNome(k)} <button class="lnk" data-tab="parcelas">Ver todas</button></div>
    ${doMes.map(p=>`<button class="row" data-desp="${p.d.id}"><div class="thumb" style="background-image:url('${p.d.thumb}')"></div>
      <div class="t"><div>${esc(p.d.desc)}</div><div>parcela ${p.i} de ${p.n} · ${p.data<=hoje()?"já entrou":"entra dia "+Number(p.data.slice(8))}</div></div>
      <div class="v"><b>${brl(p.valor)}</b><span>${linhaNet(p.net)}</span></div></button>`).join("")}</div>` : "";

  /* últimas */
  const ultimas = [...DESP].sort((a,b)=>b.criadoEm-a.criadoEm).slice(0,6);
  $("#homeUlt").innerHTML = `<div class="card-h">Últimas despesas <button class="lnk" data-tab="despesas">Ver todas</button></div>` +
    (ultimas.length ? ultimas.map(rowDesp).join("") : `<div class="empty"><b>Nada lançado ainda</b>Toque em "Despesa" e tira foto do comprovante.</div>`);

  renderDespesas(); renderParcelas(); renderAcertos();
  bindRows();
}
function linhaNet(net){
  if(net === 0) return "sem efeito no saldo";
  const quem = net > 0 ? "lucas" : "rafael";
  return `${PESSOAS[quem]} deve ${brl(Math.abs(net))}`;
}
function rowDesp(d){
  const n = d.parcelas||1;
  const pagador = d.pagou.rafael && d.pagou.lucas ? "os dois" : (d.pagou.rafael ? "Rafael" : "Lucas");
  let tag = "";
  if(recusaAtiva(d)){ const h = Math.max(1, Math.ceil((H24 - (Date.now()-d.recusa.em))/3600000)); tag = ` <span class="tag warn">volta em ${h}h</span>`; }
  const net = (d.pagou.rafael||0) - (d.deve.rafael||0);
  return `<button class="row" data-desp="${d.id}"><div class="thumb" style="background-image:url('${d.thumb}')"></div>
    <div class="t"><div>${esc(d.desc)}${tag}</div><div>${dataBR(d.data)} · pagou ${pagador}${n>1?` · ${n}x`:""}</div></div>
    <div class="v"><b>${brl(d.total)}</b><span>${linhaNet(net)}</span></div></button>`;
}
function renderDespesas(){
  const F = {todas:"Todas", minhas:"Que eu lancei", outro:`Do ${PESSOAS[OUTRO(EU)]}`, disc:"Em discussão", parc:"Parceladas"};
  $("#filtros").innerHTML = Object.entries(F).map(([k,v])=>`<button class="pill ${filtro===k?"on":""}" data-filtro="${k}">${v}</button>`).join("");
  let L = [...DESP];
  if(filtro==="minhas") L = L.filter(d=>d.autor===EU);
  if(filtro==="outro") L = L.filter(d=>d.autor!==EU);
  if(filtro==="disc") L = L.filter(recusaAtiva);
  if(filtro==="parc") L = L.filter(d=>(d.parcelas||1)>1);
  L.sort((a,b)=> b.data.localeCompare(a.data) || b.criadoEm-a.criadoEm);
  if(!L.length){ $("#listaDesp").innerHTML = `<div class="card"><div class="empty"><b>Nada aqui</b>As despesas aparecem nesta lista, por mês.</div></div>`; return; }
  const g = {}; L.forEach(d => (g[ymOf(d.data)] = g[ymOf(d.data)] || []).push(d));
  $("#listaDesp").innerHTML = Object.entries(g).map(([k,arr]) => {
    const tot = arr.reduce((a,d)=>a+d.total,0);
    return `<div class="month-h">${mesNome(k)} · ${brl0(tot)}</div><div class="card" style="padding:4px 16px">${arr.map(rowDesp).join("")}</div>`;
  }).join("");
}
function renderParcelas(){
  const L = DESP.filter(d=>(d.parcelas||1)>1).sort((a,b)=>b.data.localeCompare(a.data));
  if(!L.length){ $("#listaParc").innerHTML = `<div class="card"><div class="empty"><b>Nenhuma compra parcelada</b>Ao lançar uma despesa, ligue "Parcelado". Cada parcela entra no saldo no mês dela.</div></div>`; return; }
  $("#listaParc").innerHTML = L.map(d => {
    const ps = parcelasDe(d), feitas = ps.filter(p=>p.data<=hoje()).length;
    const falta = ps.filter(p=>p.data>hoje()).reduce((a,p)=>a+p.valor,0);
    const prox = ps.find(p=>p.data>hoje());
    return `<button class="card" style="display:block;width:100%;text-align:left" data-desp="${d.id}">
      <div class="row" style="padding:0"><div class="thumb" style="background-image:url('${d.thumb}')"></div>
      <div class="t"><div>${esc(d.desc)}</div><div>${d.parcelas}x de ${brl(ps[0].valor)} · ${linhaNet(ps[0].net)} por mês</div></div></div>
      <div class="bar"><i style="width:${(feitas/d.parcelas*100).toFixed(1)}%"></i></div>
      <div class="hint">${feitas} de ${d.parcelas} já entraram${prox?` · próxima em ${dataBR(prox.data)}`:" · terminou"}${falta?` · faltam ${brl(falta)}`:""}</div></button>`;
  }).join("");
}
function renderAcertos(){
  const L = [...ACERTOS].sort((a,b)=>b.criadoEm-a.criadoEm);
  if(!L.length){ $("#listaAcertos").innerHTML = `<div class="card"><div class="empty"><b>Nenhum acerto ainda</b>Quando chegarem aluguel e condomínio, toque em "Chegaram as contas" na tela inicial.</div></div>`; return; }
  $("#listaAcertos").innerHTML = `<div class="card" style="padding:4px 16px">${L.map(a=>`<button class="row" data-acerto="${a.id}">
    <div class="t"><div>Contas de ${dataBR(a.data)}</div><div>${a.contas.map(c=>esc(c.nome)).join(" + ")} · ${brl0(a.total)}</div></div>
    <div class="v"><b>R ${brl0(a.rafael).slice(3)} · L ${brl0(a.lucas).slice(3)}</b><span>${a.compensado?`compensou ${brl0(Math.abs(a.compensado))}`:"sem saldo"}</span></div></button>`).join("")}</div>`;
}
function bindRows(){
  $$("[data-desp]").forEach(b => b.onclick = () => abrirDesp(b.dataset.desp));
  $$("[data-acerto]").forEach(b => b.onclick = () => abrirAcerto(b.dataset.acerto));
  $$("[data-filtro]").forEach(b => b.onclick = () => { filtro = b.dataset.filtro; render(); });
}

/* =================================================================
   Sheets
================================================================= */
function openSheet(html){ $("#sheet").innerHTML = `<div class="grab"></div>${html}`; $("#backdrop").classList.add("on"); $("#sheet").classList.add("on"); $$("#sheet [data-close]").forEach(b=>b.onclick=closeSheet); $("#sheet").scrollTop = 0; }
function closeSheet(){ $("#backdrop").classList.remove("on"); $("#sheet").classList.remove("on"); }
$("#backdrop").onclick = closeSheet;
const head = t => `<div class="sheet-h"><h3>${t}</h3><button class="x" data-close aria-label="Fechar">${ic("x",16)}</button></div>`;
function alertMsg(t){ openSheet(`${head("Ops")}<div style="padding:4px 2px 6px">${esc(t)}</div><button class="primary" data-close>Ok</button>`); }

/* ---------- nova / editar despesa ---------- */
function formDesp(id){
  const ex = DESP.find(x=>x.id===id);
  const st = ex ? JSON.parse(JSON.stringify(ex)) : {
    id:uid(), desc:"", cat:"mercado", total:0, data:hoje(), pagou:{rafael:0,lucas:0}, deve:{rafael:0,lucas:0},
    parcelas:1, inicio:ymOf(hoje()), autor:EU, comentarios:[], recusa:null };
  let quem = ex ? (ex.pagou.rafael && ex.pagou.lucas ? "dois" : (ex.pagou.rafael ? "rafael" : "lucas")) : EU;
  let modo = "meio";
  if(ex){ const r=ex.deve.rafael, l=ex.deve.lucas; modo = r===0 ? "lucas" : l===0 ? "rafael" : (Math.abs(r-l)<=1 ? "meio" : "valores"); }
  let foto = null, thumb = ex ? ex.thumb : null, parcelado = (st.parcelas||1) > 1;

  const draw = () => {
    openSheet(`${head(ex?"Editar despesa":"Nova despesa")}
      <label class="photo-pick ${thumb?"has":""}" id="pp">
        ${thumb?`<img src="${foto?foto:thumb}"><span class="chg">Trocar foto</span>`:`${ic("cam",26)}<b style="color:var(--ink)">Foto do comprovante</b><span>obrigatória</span>`}
        <input type="file" accept="image/*" id="fFoto">
      </label>
      <div class="flabel">O que foi</div>
      <input class="field" id="fDesc" value="${esc(st.desc)}" placeholder="Ex.: mercado do mês, cortina da sala" maxlength="60">
      <div class="cats" style="margin-top:10px">${CATS.map(c=>`<button class="cat ${st.cat===c.id?"on":""}" data-cat="${c.id}"><span>${ic(c.ic)}</span>${c.nome.split(" ")[0]}</button>`).join("")}</div>
      <div class="two">
        <div><div class="flabel">Valor total</div><input class="field money" id="fTotal" inputmode="decimal" value="${fmtIn(st.total)}" placeholder="0,00"></div>
        <div><div class="flabel">Data da compra</div><input class="field" type="date" id="fData" value="${st.data}" style="height:56px"></div>
      </div>

      <div class="flabel">Quem pagou</div>
      <div class="seg" style="grid-template-columns:1fr 1fr 1fr">${["rafael","lucas","dois"].map(k=>`<button class="${quem===k?"on":""}" data-quem="${k}">${k==="dois"?"Os dois":PESSOAS[k]}</button>`).join("")}</div>
      ${quem==="dois"?`<div class="two" style="margin-top:8px">
        <div><div class="flabel">Rafael pagou</div><input class="field" id="pgR" inputmode="decimal" value="${fmtIn(st.pagou.rafael)}" placeholder="0,00"></div>
        <div><div class="flabel">Lucas pagou</div><input class="field" id="pgL" inputmode="decimal" value="${fmtIn(st.pagou.lucas)}" placeholder="0,00"></div></div>`:""}

      <div class="flabel">De quem é</div>
      <div class="seg" style="grid-template-columns:1fr 1fr 1fr 1fr">${[["meio","Meio a meio"],["valores","Valores"],["rafael","Só Rafael"],["lucas","Só Lucas"]].map(([k,v])=>`<button class="${modo===k?"on":""}" data-modo="${k}">${v}</button>`).join("")}</div>
      ${modo==="valores"?`<div class="two" style="margin-top:8px">
        <div><div class="flabel">Parte do Rafael</div><input class="field" id="dvR" inputmode="decimal" value="${fmtIn(st.deve.rafael)}" placeholder="0,00"></div>
        <div><div class="flabel">Parte do Lucas</div><input class="field" id="dvL" inputmode="decimal" value="${fmtIn(st.deve.lucas)}" placeholder="0,00"></div></div>`:""}

      <div class="toggle"><div><b style="font-weight:600">Parcelado</b><div class="hint" style="margin-top:0">cada parcela entra no saldo no mês dela</div></div><button class="sw ${parcelado?"on":""}" id="fParc" aria-label="Parcelado"></button></div>
      ${parcelado?`<div class="two" style="margin-top:4px">
        <div><div class="flabel">Parcelas</div><input class="field" type="number" min="2" max="48" id="fN" value="${Math.max(2,st.parcelas)}"></div>
        <div><div class="flabel">1ª parcela em</div><input class="field" type="month" id="fIni" value="${st.inicio||ymOf(st.data)}"></div></div>`:""}

      <div class="summary" id="fSum"></div>
      <div class="hint err" id="fErr"></div>
      <button class="primary" id="fOk">${ex?"Salvar alterações":"Lançar despesa"}</button>
      ${ex&&ex.autor===EU?`<button class="ghost danger" id="fDel">Apagar despesa</button>`:""}`);

    const keep = () => {
      st.desc = $("#fDesc").value.trim(); st.total = parseCents($("#fTotal").value); st.data = $("#fData").value || hoje();
      if($("#pgR")){ st.pagou.rafael = parseCents($("#pgR").value); st.pagou.lucas = parseCents($("#pgL").value); }
      if($("#dvR")){ st.deve.rafael = parseCents($("#dvR").value); st.deve.lucas = parseCents($("#dvL").value); }
      if($("#fN")){ st.parcelas = Math.min(48, Math.max(2, Math.floor(Number($("#fN").value)||2))); st.inicio = $("#fIni").value || ymOf(st.data); }
    };
    const valida = () => {
      keep();
      const T = st.total;
      if(quem==="rafael") st.pagou = {rafael:T, lucas:0};
      if(quem==="lucas") st.pagou = {rafael:0, lucas:T};
      if(modo==="meio"){ const r=Math.floor(T/2); st.deve = {rafael:r, lucas:T-r}; }
      if(modo==="rafael") st.deve = {rafael:T, lucas:0};
      if(modo==="lucas") st.deve = {rafael:0, lucas:T};
      if(!parcelado){ st.parcelas = 1; st.inicio = ymOf(st.data); }
      let err = "";
      if(!thumb) err = "Falta a foto do comprovante.";
      else if(!st.desc) err = "Diga o que foi.";
      else if(T<=0) err = "Coloque o valor total.";
      else if(quem==="dois" && st.pagou.rafael + st.pagou.lucas !== T) err = `O que cada um pagou soma ${brl(st.pagou.rafael+st.pagou.lucas)}, mas o total é ${brl(T)}.`;
      else if(modo==="valores" && st.deve.rafael + st.deve.lucas !== T) err = `As partes somam ${brl(st.deve.rafael+st.deve.lucas)}, mas o total é ${brl(T)}.`;
      $("#fErr").textContent = err;
      $("#fOk").disabled = !!err;
      const net = st.pagou.rafael - st.deve.rafael;
      let sum = !T ? "Preencha o valor para ver como fica." :
        net===0 ? "Essa despesa não mexe no saldo." :
        `Com essa despesa, <b>${PESSOAS[net>0?"lucas":"rafael"]} fica devendo ${brl(Math.abs(net))}</b> ao ${PESSOAS[net>0?"rafael":"lucas"]}.`;
      if(parcelado && T){ const n=st.parcelas; sum += `<br>${n}x de ${brl(divide(T,n)[0])}, a partir de ${mesNome(st.inicio)}. Por mês: ${linhaNet(divide(net,n)[0])}.`; }
      $("#fSum").innerHTML = sum;
      return !err;
    };
    $("#fFoto").onchange = async e => {
      const f = e.target.files[0]; if(!f) return;
      keep(); $("#pp").innerHTML = `<span>Preparando a foto…</span>`;
      try{ const r = await comprimir(f); foto = r.foto; thumb = r.thumb; }catch(err){ alertMsg("Não consegui abrir essa imagem. Tenta um print ou outra foto."); return; }
      draw();
    };
    ["#fDesc","#fTotal","#fData","#pgR","#pgL","#dvR","#dvL","#fN","#fIni"].forEach(s => { const el=$(s); if(el) el.oninput = valida; });
    $$("[data-cat]").forEach(b => b.onclick = () => { keep(); st.cat = b.dataset.cat; draw(); });
    $$("[data-quem]").forEach(b => b.onclick = () => { keep(); quem = b.dataset.quem; if(quem==="dois" && !st.pagou.rafael && !st.pagou.lucas){ const r=Math.floor(st.total/2); st.pagou={rafael:r,lucas:st.total-r}; } draw(); });
    $$("[data-modo]").forEach(b => b.onclick = () => { keep(); modo = b.dataset.modo; if(modo==="valores"){ const r=Math.floor(st.total/2); if(st.deve.rafael+st.deve.lucas!==st.total) st.deve={rafael:r,lucas:st.total-r}; } draw(); });
    $("#fParc").onclick = () => { keep(); parcelado = !parcelado; if(parcelado && (st.parcelas||1)<2) st.parcelas = 10; draw(); };
    $("#fOk").onclick = async () => {
      if(!valida()) return;
      const b = $("#fOk"); b.disabled = true; b.textContent = "Salvando…";
      const d = Object.assign({}, st, {thumb, criadoEm: ex ? ex.criadoEm : Date.now(), editadoEm: ex ? Date.now() : null});
      if(!ex){ d.fotoId = uid(); d.autor = EU; d.autorUid = cloud.user ? cloud.user.uid : null; }
      else if(foto){ d.fotoId = d.fotoId || uid(); }
      if(ex && recusaAtiva(ex)){ d.recusa = Object.assign({}, ex.recusa, {editada:true}); d.comentarios = (d.comentarios||[]).concat([{por:EU, texto:"Editei a despesa.", em:Date.now()}]); }
      try{ await DB.saveDesp(d, foto); closeSheet(); }catch(e){ console.error(e); b.disabled=false; b.textContent="Tentar de novo"; $("#fErr").textContent = "Não salvou. Confere a internet."; }
    };
    if($("#fDel")) $("#fDel").onclick = () => confirmar("Apagar esta despesa?", "Ela e o comprovante somem para os dois.", "Apagar", async () => { await DB.delDesp(ex); });
    valida();
  };
  draw();
}

function confirmar(titulo, texto, botao, acao){
  openSheet(`${head(titulo)}<div class="hint" style="font-size:14px;margin-top:0">${esc(texto)}</div>
    <button class="primary" id="cOk" style="background:var(--warn)">${botao}</button><button class="ghost" data-close>Cancelar</button>`);
  $("#cOk").onclick = async () => { $("#cOk").disabled = true; try{ await acao(); closeSheet(); }catch(e){ console.error(e); alertMsg("Não deu certo. Tenta de novo."); } };
}

/* ---------- detalhe ---------- */
async function abrirDesp(id){
  const d = DESP.find(x=>x.id===id); if(!d) return;
  const ps = parcelasDe(d), n = ps.length;
  const ativa = recusaAtiva(d);
  const podeRecusar = d.autor !== EU && !ativa;
  const souRecusador = ativa && d.recusa.por === EU;
  const cat = catOf(d.cat);
  openSheet(`${head(esc(d.desc))}
    <img class="det-photo" id="dFoto" src="${d.thumb}" alt="Comprovante">
    <div class="hint">Toque na foto para ver o comprovante inteiro.</div>
    ${ativa?`<div class="summary" style="background:#fbe4dd;margin-top:10px"><b>Em discussão.</b> ${PESSOAS[d.recusa.por]} recusou: “${esc(d.recusa.motivo)}”.<br>
      Fica fora do saldo até ${PESSOAS[d.recusa.por]} aprovar ou até ${new Date(d.recusa.em+H24).toLocaleString("pt-BR",{weekday:"short",hour:"2-digit",minute:"2-digit"})}.${d.recusa.editada?"<br>Já foi editada depois da recusa.":""}</div>`:""}

      <div style="display:flex;justify-content:space-between"><span>${cat.nome} · ${dataBR(d.data)}</span><b>${brl(d.total)}</b></div>
      <div class="split"><span class="h"></span><span class="h n">pagou</span><span class="h n">parte</span>
        <span>Rafael</span><span class="n">${brl(d.pagou.rafael)}</span><span class="n">${brl(d.deve.rafael)}</span>
        <span>Lucas</span><span class="n">${brl(d.pagou.lucas)}</span><span class="n">${brl(d.deve.lucas)}</span></div>
      <div style="margin-top:8px"><b>${linhaNet(d.pagou.rafael-d.deve.rafael)}</b>${n>1?` no total, em ${n} parcelas de ${brl(ps[0].valor)}`:""}</div>
      <div class="hint">Lançada por ${PESSOAS[d.autor]}${d.editadoEm?" · editada":""}</div>
    </div>
    ${n>1?`<div class="flabel">Parcelas</div><div class="card" style="padding:4px 14px;margin:0">${ps.map(p=>`<div class="row"><div class="t"><div>${p.i}/${p.n} · ${dataBR(p.data)}</div></div><div class="v"><b>${brl(p.valor)}</b><span>${p.data<=hoje()?"entrou":"a entrar"}</span></div></div>`).join("")}</div>`:""}
    <div class="flabel">Comentários</div>
    ${(d.comentarios||[]).map(c=>`<div class="comment"><small>${PESSOAS[c.por]} · ${new Date(c.em).toLocaleString("pt-BR",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}</small>${esc(c.texto)}</div>`).join("") || `<div class="hint" style="margin-top:0">Nenhum comentário.</div>`}
    <div style="display:flex;gap:8px;margin-top:8px"><input class="field" id="cTxt" placeholder="Escrever um comentário" maxlength="300"><button class="btn" id="cSend" style="height:46px;padding:0 16px">Enviar</button></div>
    ${souRecusador?`<button class="primary" id="dAprovar">Aprovar e voltar pro saldo</button>`:""}
    ${podeRecusar?`<button class="ghost danger" id="dRecusar">Recusar esta divisão</button>`:""}
    ${d.autor===EU?`<button class="ghost" id="dEditar">Editar</button>`:""}`);

  DB.getFoto(d.fotoId).then(f => { const im = $("#dFoto"); if(f && im) im.src = f; }).catch(()=>{});
  $("#dFoto").onclick = async () => {
    const v = $("#viewer"); v.classList.remove("hidden"); v.innerHTML = `<img src="${d.thumb}" style="filter:blur(2px)">`;
    const f = await DB.getFoto(d.fotoId).catch(()=>null);
    v.innerHTML = f ? `<img src="${f}">` : `<div style="color:#fff">Não achei a foto.</div>`;
  };
  $("#cSend").onclick = async () => {
    const t = $("#cTxt").value.trim(); if(!t) return;
    const nd = Object.assign({}, d, {comentarios:(d.comentarios||[]).concat([{por:EU, texto:t, em:Date.now()}])});
    await DB.saveDesp(nd); abrirDesp(id);
  };
  if($("#dAprovar")) $("#dAprovar").onclick = async () => {
    const nd = Object.assign({}, d, {recusa:Object.assign({}, d.recusa, {ok:true}), comentarios:(d.comentarios||[]).concat([{por:EU, texto:"Aprovei.", em:Date.now()}])});
    await DB.saveDesp(nd); closeSheet();
  };
  if($("#dRecusar")) $("#dRecusar").onclick = () => {
    openSheet(`${head("Recusar a divisão")}
      <div class="hint" style="margin-top:0;font-size:14px">A despesa sai do saldo e o ${PESSOAS[d.autor]} vê o motivo. Ela volta quando você aprovar ou depois de 24 horas.</div>
      <div class="flabel">Por quê?</div><textarea class="field" id="rMot" placeholder="Ex.: a pizza era só sua" maxlength="300"></textarea>
      <button class="primary" id="rOk" style="background:var(--warn)">Recusar</button><button class="ghost" data-close>Cancelar</button>`);
    $("#rOk").onclick = async () => {
      const m = $("#rMot").value.trim(); if(!m){ $("#rMot").focus(); return; }
      const nd = Object.assign({}, d, {recusa:{por:EU, motivo:m, em:Date.now(), ok:false, editada:false}, comentarios:(d.comentarios||[]).concat([{por:EU, texto:`Recusei: ${m}`, em:Date.now()}])});
      await DB.saveDesp(nd); closeSheet();
    };
  };
  if($("#dEditar")) $("#dEditar").onclick = () => formDesp(id);
}
$("#viewer").onclick = () => { $("#viewer").classList.add("hidden"); $("#viewer").innerHTML = ""; };

/* ---------- chegaram as contas ---------- */
function abrirContas(){
  const ult = ultimoAcerto();
  let contas = ult ? ult.contas.map(c=>({nome:c.nome, valor:0})) : [{nome:"Aluguel", valor:0},{nome:"Condomínio", valor:0}];
  const s = saldoAtual();
  const draw = () => {
    openSheet(`${head("Chegaram as contas")}
      <div class="hint" style="margin-top:0;font-size:13.5px">Coloque o valor de cada conta. Divido ao meio e compenso o saldo da casa (${Math.abs(s)<100?"zerado":`${PESSOAS[s>0?"lucas":"rafael"]} deve ${brl(Math.abs(s))}`}).</div>
      ${contas.map((c,i)=>`<div class="two" style="grid-template-columns:1.2fr 1fr;margin-top:10px">
        <input class="field" data-cn="${i}" value="${esc(c.nome)}" placeholder="Nome da conta">
        <input class="field" data-cv="${i}" inputmode="decimal" value="${fmtIn(c.valor)}" placeholder="0,00"></div>`).join("")}
      <button class="ghost" id="kAdd" style="margin-top:10px">+ Outra conta</button>
      <div class="summary" id="kRes"></div>
      <button class="primary" id="kOk">Fechar o período</button>`);
    const keep = () => { $$("[data-cn]").forEach(el => contas[el.dataset.cn].nome = el.value.trim()); $$("[data-cv]").forEach(el => contas[el.dataset.cv].valor = parseCents(el.value)); };
    const calc = () => {
      keep();
      const cs = contas.filter(c=>c.valor>0);
      const r = calcFechamento(cs, s);
      $("#kOk").disabled = !cs.length;
      $("#kRes").innerHTML = !cs.length ? "Preencha pelo menos uma conta." :
        `Total ${brl(r.total)} · ${brl(r.baseR)} para cada um<br>
         ${r.compensado?`Compensando ${brl(Math.abs(r.compensado))} do saldo:<br>`:""}
         <div style="font-size:18px;margin-top:6px"><b>Rafael paga ${brl(r.rafael)}</b><br><b>Lucas paga ${brl(r.lucas)}</b></div>
         ${Math.abs(r.sobra)>=100?`<div class="hint">O saldo era maior que a metade das contas. Ficam ${brl(Math.abs(r.sobra))} para o próximo período.</div>`:""}`;
      return {cs, r};
    };
    $$("[data-cn],[data-cv]").forEach(el => el.oninput = calc);
    $("#kAdd").onclick = () => { keep(); contas.push({nome:"", valor:0}); draw(); };
    $("#kOk").onclick = async () => {
      const {cs, r} = calc(); if(!cs.length) return;
      $("#kOk").disabled = true;
      const a = {id:uid(), data:hoje(), criadoEm:Date.now(), contas:cs.map(c=>({nome:c.nome||"Conta", valor:c.valor})), total:r.total,
        saldoAntes:s, compensado:r.compensado, rafael:r.rafael, lucas:r.lucas, autor:EU};
      try{ await DB.saveAcerto(a); abrirAcerto(a.id); }catch(e){ console.error(e); alertMsg("Não salvou. Confere a internet."); }
    };
    calc();
  };
  draw();
}
function abrirAcerto(id){
  const L = [...ACERTOS].sort((a,b)=>a.criadoEm-b.criadoEm);
  const idx = L.findIndex(x=>x.id===id); const a = L[idx]; if(!a) return;
  const ps = periodo(L[idx-1]||null, a);
  const ultimo = idx === L.length-1;
  openSheet(`${head(`Contas de ${dataBR(a.data)}`)}
    <div class="summary" style="margin-top:0">
      ${a.contas.map(c=>`<div style="display:flex;justify-content:space-between"><span>${esc(c.nome)}</span><span>${brl(c.valor)}</span></div>`).join("")}
      <div style="display:flex;justify-content:space-between;border-top:1px solid var(--line);margin-top:6px;padding-top:6px"><b>Total</b><b>${brl(a.total)}</b></div>
      <div class="hint">Saldo da casa naquele dia: ${Math.abs(a.saldoAntes)<100?"zerado":`${PESSOAS[a.saldoAntes>0?"lucas":"rafael"]} devia ${brl(Math.abs(a.saldoAntes))}`}</div>
      <div style="font-size:18px;margin-top:8px"><b>Rafael pagou ${brl(a.rafael)}</b><br><b>Lucas pagou ${brl(a.lucas)}</b></div>
    </div>
    <div class="flabel">O que entrou nesse período (${ps.length})</div>
    <div class="card" style="padding:4px 14px;margin:0">${ps.length ? ps.map(p=>`<button class="row" data-desp="${p.d.id}"><div class="thumb" style="background-image:url('${p.d.thumb}')"></div>
      <div class="t"><div>${esc(p.d.desc)}${p.n>1?` (${p.i}/${p.n})`:""}</div><div>${dataBR(p.data)}</div></div><div class="v"><b>${brl(p.valor)}</b><span>${linhaNet(p.net)}</span></div></button>`).join("") : `<div class="empty">Nenhuma despesa no período.</div>`}</div>
    ${ultimo?`<button class="ghost danger" id="aDel">Desfazer este acerto</button>`:""}`);
  $$("#sheet [data-desp]").forEach(b => b.onclick = () => abrirDesp(b.dataset.desp));
  if($("#aDel")) $("#aDel").onclick = () => confirmar("Desfazer o acerto?", "O saldo volta a ser o de antes dessas contas.", "Desfazer", async () => { await DB.delAcerto(a); });
}

/* ---------- quem sou eu / conta ---------- */
function abrirPerfil(){
  openSheet(`${head("Você")}
    <div style="display:flex;align-items:center;gap:12px"><div style="width:84px">${florPose(POSES[EU][0])}</div>
    <div><b style="font-size:18px">${PESSOAS[EU]}</b><div class="hint" style="margin-top:2px">${cloud.user?esc(cloud.user.email):"modo local (teste)"}</div></div></div>
    <div class="flabel">Poses da Flor para você</div>
    <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:4px">${POSES[EU].map(p=>`<button data-pose="${p}" title="${POSE_NOME[p]}">${florPose(p)}</button>`).join("")}</div>
    <button class="ghost" id="pTroca">Não sou o ${PESSOAS[EU]}</button>
    <button class="ghost" id="pExp">Exportar tudo (backup)</button>
    ${cloud.user?`<button class="ghost danger" id="pSair">Sair da conta</button>`:""}`);
  $$("[data-pose]").forEach(b => b.onclick = () => { poseAtual = b.dataset.pose; poseIdx = POSES[EU].indexOf(poseAtual); closeSheet(); go("home"); render(); });
  $("#pTroca").onclick = () => { closeSheet(); telaQuem(); };
  $("#pExp").onclick = () => {
    const blob = new Blob([JSON.stringify({despesas:DESP.map(d=>Object.assign({},d,{thumb:undefined})), acertos:ACERTOS},null,2)],{type:"application/json"});
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `mansao-quirino-${hoje()}.json`; a.click();
  };
  if($("#pSair")) $("#pSair").onclick = () => cloud.auth.signOut();
}
function telaQuem(){
  const f = $("#full"); f.classList.remove("hidden");
  f.innerHTML = `<div class="word">Mansão Quirino<small>contas da casa</small></div>
    <div style="margin-top:20px;font-weight:600">Quem é você?</div>
    <div class="pickp">${Object.keys(PESSOAS).map(p=>`<button data-sou="${p}">${florPose(POSES[p][0])}${PESSOAS[p]}</button>`).join("")}</div>`;
  $$("[data-sou]").forEach(b => b.onclick = async () => {
    EU = b.dataset.sou; poseAtual = null;
    try{ localStorage.setItem("quirino.eu", EU); }catch(e){}
    if(cloud.user) await DB.setMembro(EU).catch(()=>{});
    f.classList.add("hidden"); go("home"); render();
  });
}
function telaLogin(msg=""){
  const f = $("#full"); f.classList.remove("hidden");
  f.innerHTML = `<div class="duo">${florPose("musica")}${florPose("halter")}</div>
    <div class="word">Mansão Quirino<small>contas da casa</small></div>
    <form id="lg">
      <div class="flabel">E-mail</div><input class="field" id="lgM" type="email" autocomplete="email" required>
      <div class="flabel">Senha</div><input class="field" id="lgS" type="password" autocomplete="current-password" required>
      <button class="primary" type="submit">Entrar</button>
      <div class="err" id="lgE">${esc(msg)}</div>
    </form>`;
  $("#lg").onsubmit = e => {
    e.preventDefault(); $("#lgE").textContent = "";
    cloud.auth.signInWithEmailAndPassword($("#lgM").value.trim(), $("#lgS").value).catch(err => {
      $("#lgE").textContent = {"auth/invalid-credential":"E-mail ou senha errados.","auth/too-many-requests":"Muitas tentativas. Espera um pouco."}[err.code] || "Não deu certo. Tenta de novo.";
    });
  };
}

/* =================================================================
   Navegação
================================================================= */
function go(t){
  tab = t;
  ["home","despesas","parcelas","acertos"].forEach(x => $("#p-"+x).classList.toggle("hidden", x!==t));
  $$(".tab[data-tab]").forEach(b => b.classList.toggle("on", b.dataset.tab===t));
  scrollTo({top:0});
}
document.addEventListener("click", e => {
  const t = e.target.closest("[data-tab]"); if(t){ go(t.dataset.tab); return; }
  if(e.target.closest("[data-nova]")) formDesp(null);
  if(e.target.closest("[data-who]")) abrirPerfil();
});
$("#btnContas").onclick = abrirContas;
$("#heroFlor").onclick = () => {
  proximaPose(); render();
  const s = $("#heroFlor .flor"); s.classList.add("boop"); setTimeout(()=>s.classList.remove("boop"), 450);
};
store.onChange(render);
setInterval(() => { if(EU) render(); }, 60*1000);   // recusas que vencem as 24h voltam sozinhas

/* ícone da tela de início */
function makeIcon(){
  try{
    const inner = florPose("feliz",{ink:"#141414",bow:"#e0457b",tongue:"#e89aa1",accent:"#d9467a"}).replace(/class="[^"]*"/g,"");
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="-40 -50 280 280"><rect x="-40" y="-50" width="280" height="280" fill="#fde8ef"/>${inner}</svg>`;
    const img = new Image();
    img.onload = () => { const c=document.createElement("canvas"); c.width=c.height=360; c.getContext("2d").drawImage(img,0,0,360,360);
      const l=document.createElement("link"); l.rel="apple-touch-icon"; l.href=c.toDataURL("image/png"); document.head.appendChild(l); };
    img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
  }catch(e){}
}
makeIcon();

/* =================================================================
   Início
================================================================= */
function loadScript(src){ return new Promise((ok,err)=>{ const s=document.createElement("script"); s.src=src; s.onload=ok; s.onerror=err; document.head.appendChild(s); }); }
async function iniciar(){
  try{ EU = localStorage.getItem("quirino.eu"); }catch(e){}
  if(!FIREBASE){
    DB.init();
    if(!EU) telaQuem(); else render();
    return;
  }
  const base = "https://www.gstatic.com/firebasejs/10.12.2/";
  await loadScript(base+"firebase-app-compat.js");
  await Promise.all([loadScript(base+"firebase-auth-compat.js"), loadScript(base+"firebase-firestore-compat.js")]);
  firebase.initializeApp(FIREBASE);
  cloud.auth = firebase.auth(); cloud.fs = firebase.firestore();
  try{ await cloud.fs.enablePersistence({synchronizeTabs:true}); }catch(e){}
  cloud.auth.onAuthStateChanged(async user => {
    cloud.user = user;
    if(!user){ cloud.unsubs.forEach(u=>u()); cloud.unsubs=[]; telaLogin(); return; }
    $("#full").classList.add("hidden");
    const m = await DB.getMembro().catch(()=>null);
    if(m){ EU = m; try{ localStorage.setItem("quirino.eu", EU); }catch(e){} }
    DB.init();
    if(!EU) telaQuem(); else { go("home"); render(); }
  });
}
iniciar().catch(e => { console.error(e); alertMsg("Sem internet para abrir o app agora."); });
</script>
